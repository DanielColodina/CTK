<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Cliente</title>

  <style>
    body {
        font-family: Arial;
        margin: 40px;
        background: #f4f4f4;
    }

    h2, h3 {
        text-align: center;
    }

    form {
        background: white;
        padding: 20px;
        width: 300px;
        margin: auto;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
    }

    input {
        width: 100%;
        padding: 8px;
        margin: 8px 0;
    }

    button {
        padding: 8px;
        cursor: pointer;
    }

    table {
        margin: 30px auto;
        border-collapse: collapse;
        background: white;
    }

    th, td {
        padding: 10px;
        border: 1px solid #ccc;
    }

    .btn-excluir {
        background: red;
        color: white;
        border: none;
        padding: 5px;
    }

    #mensagem {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Cadastro de Cliente</h2>

<form id="formCliente">
  <input type="text" name="nome" placeholder="Nome" required>
  <input type="text" name="senha" placeholder="Senha" required>
  <input type="number" name="numero" placeholder="Número" required>
  <input type="text" name="enderecoObra" placeholder="Endereço da obra" required>
  <input type="number" name="cpf" placeholder="CPF" required>

  <button type="submit">Cadastrar</button>
</form>

<p id="mensagem"></p>

<h3>Clientes cadastrados</h3>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Nome</th>
    <th>Número</th>
    <th>Endereço</th>
    <th>CPF</th>
    <th>Ação</th>
  </tr>
  </thead>
  <tbody id="listaClientes"></tbody>
</table>

<script>

  // 🔥 CARREGAR CLIENTES
  function carregarClientes() {
      fetch("/clientes")
          .then(res => res.json())
          .then(clientes => {
              const tabela = document.getElementById("listaClientes");
              tabela.innerHTML = "";

              clientes.forEach(cliente => {
                  tabela.innerHTML += `
                      <tr>
                          <td>${cliente.id}</td>
                          <td>${cliente.nome}</td>
                          <td>${cliente.numero}</td>
                          <td>${cliente.enderecoObra}</td>
                          <td>${cliente.cpf}</td>
                          <td>
                              <button class="btn-excluir" onclick="excluir(${cliente.id})">
                                  Excluir
                              </button>
                          </td>
                      </tr>
                  `;
              });
          });
  }

  // 🔥 EXCLUIR CLIENTE
  function excluir(id) {
      if (!confirm("Deseja excluir este cliente?")) return;

      fetch(`/clientes/${id}`, {
          method: "DELETE"
      })
      .then(res => res.text())
      .then(msg => {
          document.getElementById("mensagem").innerText = msg;
          carregarClientes();
      })
      .catch(err => {
          document.getElementById("mensagem").innerText = "Erro ao excluir";
          console.error(err);
      });
  }

  // 🔥 SALVAR CLIENTE
  document.getElementById("formCliente").addEventListener("submit", function(e) {
      e.preventDefault();

      const dados = {
          nome: this.nome.value,
          senha: this.senha.value,
          numero: Number(this.numero.value),
          enderecoObra: this.enderecoObra.value,
          cpf: Number(this.cpf.value)
      };

      fetch("/clientes", {
          method: "POST",
          headers: {
              "Content-Type": "application/json"
          },
          body: JSON.stringify(dados)
      })
      .then(res => res.text())
      .then(msg => {
          document.getElementById("mensagem").innerText = msg;
          this.reset();
          carregarClientes(); // 🔥 atualiza tabela
      })
      .catch(err => {
          document.getElementById("mensagem").innerText = "Erro ao salvar cliente";
          console.error(err);
      });
  });

  // 🔥 CARREGA AO ABRIR
  carregarClientes();

</script>

</body>
</html>
</body>
</html>
